PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Prova de Trabalho (Proof of Work)"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Este plugin CAPTCHA apresenta uma tarefa matemática ao navegador do usuário que o próprio navegador resolve automaticamente. O objetivo não é provar que o usuário é humano, mas sim comprovar que o dispositivo investiu o processamento necessário para solucionar o desafio. Baseado na biblioteca Altcha (altcha.org)."
