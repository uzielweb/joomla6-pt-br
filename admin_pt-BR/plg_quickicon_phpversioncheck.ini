PLG_QUICKICON_PHPVERSIONCHECK="Ícone rápido - Verificação da versão do PHP"
PLG_QUICKICON_PHPVERSIONCHECK_SECURITY_ONLY="Sua versão do PHP, %1$s, está recebendo apenas correções de segurança do projeto PHP no momento. Isso significa que sua versão do PHP em breve deixará de ter suporte. Recomendamos planejar a atualização para uma versão mais recente do PHP antes que o suporte termine em %2$s. O Joomla ficará mais rápido e seguro se você atualizar para uma versão mais recente do PHP. Entre em contato com sua hospedagem para obter instruções de atualização."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED="Detectamos que seu servidor está usando o PHP %1$s, que é obsoleto e não recebe mais atualizações oficiais de segurança pelos seus desenvolvedores. O Projeto Joomla! recomenda atualizar seu site para o PHP %2$s ou posterior, que receberá atualizações de segurança pelo menos até %3$s. <br><br>Solicite à sua hospedagem que torne o PHP %2$s ou uma versão posterior a versão padrão do seu site. Se sua hospedagem já suporta o PHP %2$s, ative o PHP %2$s na raiz do seu site e nos diretórios 'administrator' – normalmente você pode fazer isso através de uma ferramenta no painel de controle da hospedagem, mas é melhor consultar sua hospedagem se tiver dúvidas."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED_JOOMLA_OUTDATED="Detectamos que seu servidor está usando o PHP %1$s, que é obsoleto e não recebe mais atualizações oficiais de segurança pelos seus desenvolvedores. Além disso, não podemos recomendar uma versão mais recente do PHP porque você está usando uma versão desatualizada do Joomla!. Recomendamos atualizar o Joomla! e depois seguir as instruções para atualização do PHP."
PLG_QUICKICON_PHPVERSIONCHECK_XML_DESCRIPTION="Verifica o status de suporte da versão PHP da sua instalação e gera um aviso se não for totalmente compatível."
