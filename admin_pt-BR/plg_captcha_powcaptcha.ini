PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Prova de Trabalho (Proof of Work)"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Este plugin CAPTCHA apresenta uma tarefa matemática ao navegador do usuário que o próprio navegador resolve automaticamente. O objetivo não é provar que o usuário é humano, mas sim comprovar que o dispositivo investiu o processamento necessário para solucionar o desafio. Baseado na biblioteca Altcha (altcha.org)."

; Parâmetros administrativos
PLG_CAPTCHA_POWCAPTCHA_AUTOSOLVE_DESC="Define se o CAPTCHA deve ser resolvido automaticamente sem exigir que o visitante clique na caixa de verificação."
PLG_CAPTCHA_POWCAPTCHA_AUTOSOLVE_LABEL="Resolução Automática"
PLG_CAPTCHA_POWCAPTCHA_AUTOSOLVE_OFF="Desativada (exige clique)"
PLG_CAPTCHA_POWCAPTCHA_AUTOSOLVE_ONFOCUS="Quando o campo do CAPTCHA receber foco"
PLG_CAPTCHA_POWCAPTCHA_AUTOSOLVE_ONLOAD="Ao carregar a página"
PLG_CAPTCHA_POWCAPTCHA_AUTOSOLVE_ONSUBMIT="Ao enviar o formulário"
PLG_CAPTCHA_POWCAPTCHA_DIFFICULTY_DESC="Quanto maior a dificuldade do CAPTCHA, maior será o tempo de cálculo exigido do navegador para resolvê-lo."
PLG_CAPTCHA_POWCAPTCHA_DIFFICULTY_LABEL="Dificuldade"
PLG_CAPTCHA_POWCAPTCHA_DIFFICULTY_CUSTOM="Personalizada"
PLG_CAPTCHA_POWCAPTCHA_DIFFICULTY_EASY="Fácil"
PLG_CAPTCHA_POWCAPTCHA_DIFFICULTY_HARD="Difícil"
PLG_CAPTCHA_POWCAPTCHA_DIFFICULTY_MODERATE="Moderada"
PLG_CAPTCHA_POWCAPTCHA_EXPIRATION_DESC="Por quanto tempo uma solução gerada deve permanecer válida?"
PLG_CAPTCHA_POWCAPTCHA_EXPIRATION_LABEL="Tempo de Expiração"
PLG_CAPTCHA_POWCAPTCHA_EXPIRATION_1MIN="1 minuto"
