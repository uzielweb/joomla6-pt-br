COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="O que há de novo no Joomla 6.1!"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Bem-vindo ao Joomla 6.1!</h1><p>O Joomla 6.1 traz melhorias importantes que tornam a criação de sites mais fácil, segura e flexível. Este tour apresenta os principais destaques em resumo.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">A proteção contra spam está de VOLTA com o CAPTCHA Proof-of-Work</h2><p>Sem necessidade de conta ou API, respeitando a privacidade e a acessibilidade, este captcha resolve desafios matemáticos silenciosamente em segundo plano, de forma invisível para os visitantes.</p><p>Para ativar, acesse <em>Extensões</em> -&gt; <em>Plugins</em>, pesquise por <strong>captcha</strong>, ative-o e defina-o como padrão na Configuração Global.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"Estados de verificação e verificado do captcha\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Representação gráfica do fluxo de trabalho básico\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Fluxo de conteúdo em resumo com o Editor Visual de Fluxo de Trabalho</h2><p>Gerencie o fluxo de trabalho do seu conteúdo com mais facilidade por meio do novo diagrama interativo que permite visualizar todo o processo de publicação.</p><p>Ative os Fluxos de Trabalho em <em>Gerenciador de Artigos</em> -&gt; <em>Fluxos de Trabalho</em> e procure pelo botão de gráfico.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Três novas opções de campo personalizado de mídia: Áudio, Vídeo e Documentos</h2><p>Ao criar Campos Personalizados para o seu conteúdo, agora você pode permitir que os criadores incluam qualquer tipo de mídia, não apenas imagens.</p><p>As mídias são renderizadas como HTML5 &lt;audio&gt;, &lt;video&gt; ou links de documentos (PDF, planilhas...).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"As três opções de campo de mídia: áudio, vídeo e documento\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Módulos mais inteligentes com Versionamento e Associações Multilíngues</h2><p>O Joomla já oferece histórico de versões para artigos há muito tempo. Esse mesmo recurso agora foi estendido aos módulos.<br>Se você mantém um site multilíngue, agora pode associar instâncias de módulos entre diferentes idiomas, da mesma forma que associa artigos.</p><h2>Outras melhorias que merecem destaque</h2><ul class=\"mb-3\"><li>Suporte à abreviação <strong>&lt;abbr&gt;</strong> no editor de texto TinyMCE, semanticamente correto e aprimorando a acessibilidade (procure o novo botão Abreviação na barra de ferramentas do TinyMCE ao editar conteúdo).</li><li>Melhorias de usabilidade no status de substituições de idioma e criação rápida de substituições ausentes (indicador de status e edição facilitada).</li></ul></div></div>"
