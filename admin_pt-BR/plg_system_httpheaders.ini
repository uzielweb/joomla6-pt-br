PLG_SYSTEM_HTTPHEADERS="Sistema - HTTP Headers"
PLG_SYSTEM_HTTPHEADERS_ADDITIONAL_HEADER="Forçar HTTP Headers"
PLG_SYSTEM_HTTPHEADERS_ADDITIONAL_HEADER_KEY="HTTP Header"
PLG_SYSTEM_HTTPHEADERS_ADDITIONAL_HEADER_VALUE="Valor do HTTP Header"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY="<a href='https://developer.mozilla.org/pt-BR/docs/Web/HTTP/CSP' target='_blank' rel='noopener noreferrer'>Content Security Policy (CSP)</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_CLIENT="Cliente"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED="frame-ancestors 'self'"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED_DESC="Ativa a proteção contra clickjacking frame-ancestors da CSP e permite apenas a origem 'self'. Use o formulário abaixo para permitir outras origens além de 'self'."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/nonce' target='_blank' rel='noopener noreferrer'>Nonce</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED_DESC="Ativa a lista de permissões para scripts inline específicos usando um nonce criptográfico (número usado uma única vez) para todos os scripts e estilos que utilizam a API do Joomla. Especificar um nonce faz com que navegadores modernos ignorem 'unsafe-inline', que ainda deve ser definido para navegadores antigos sem suporte a nonce."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY_DESC="Use o cabeçalho 'Content-Security-Policy-Report-Only' em vez de 'Content-Security-Policy'."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY="Report-Only"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED="strict-dynamic"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED_DESC="A expressão de origem strict-dynamic especifica que a confiança explicitamente concedida a um script presente na marcação, acompanhado de um nonce ou hash, será propagada para todos os scripts carregados por esse script raiz. Ao mesmo tempo, quaisquer expressões permitidas ou de origem como 'self' ou 'unsafe-inline' serão ignoradas."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src' target='_blank' rel='noopener noreferrer'>Hashes de script</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED_DESC="Ativa a lista de permissões opcional baseada em hash para scripts inline usando um hash criptográfico para todos os scripts que utilizam a API do Joomla. Especificar hashes faz com que navegadores modernos ignorem 'unsafe-inline', que ainda deve ser definido para navegadores antigos sem suporte a hash."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src' target='_blank' rel='noopener noreferrer'>Hashes de estilo</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED_DESC="Ativa a lista de permissões opcional baseada em hash para estilos inline usando um hash criptográfico para todos os estilos que utilizam a API do Joomla. Especificar hashes faz com que navegadores modernos ignorem 'unsafe-inline', que ainda deve ser definido para navegadores antigos sem suporte a hash."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES="Adicionar diretiva"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_DIRECTIVE="Diretiva Política"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_VALUE="Valor"
PLG_SYSTEM_HTTPHEADERS_COOP="Cross-Origin-Opener-Policy"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT="Cliente"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT_BOTH="Ambos"
PLG_SYSTEM_HTTPHEADERS_HSTS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security' target='_blank' rel='noopener noreferrer'>HTTP Strict Transport Security (HSTS)</a>"
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE="max-age"
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE_DESC="Esta opção define o tempo para 'max-age', especificado em segundos. O valor padrão é 31536000, o que corresponde a um ano."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD="<a href='https://hstspreload.org' target='_blank' rel='noopener noreferrer'>Preload</a>"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_DESC="Esta opção ativa a inclusão nas chamadas listas de pré-carregamento do navegador."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE="Importante"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE_DESC="HSTS significa que seu domínio não poderá mais ser acessado sem HTTPS. Uma vez adicionado à lista de pré-carregamento (preload), isso não é fácil de desfazer. Domínios podem ser removidos, mas leva meses para os usuários receberem a alteração via atualização do navegador.<br><strong>Esta opção é muito importante para evitar ataques 'man-in-the-middle', portanto deve ser ativada, mas somente se você tiver certeza de que o HTTPS é suportado no domínio e em todos os subdomínios a longo prazo! O valor de 'max-age' deve ser definido como 63072000 (2 anos) para registro.</strong>"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS="Também para subdomínios"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS_DESC="O HSTS também deve ser habilitado <strong>para subdomínios</strong> normalmente o subdomínio 'www' é levado em consideração na criação do certificado SSL. Se forem utilizados outros subdomínios, observe que eles também recebem um certificado SSL válido."
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_ACTION="Habilitar cabeçalhos de segurança padrão"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_BODY="<p>Joomla! vem com um conjunto integrado de ferramentas que ajudam você a lidar com cabeçalhos de segurança HTTP. Esses cabeçalhos ajudam seu navegador, por exemplo, a proteger seu site dos ataques <a href='https://en.wikipedia.org/wiki/Cross-site_scripting' target='_blank' rel='noopener noreferrer'>XSS</a> e <a href='https://en.wikipedia.org/wiki/Clickjacking' target='_blank' rel='noopener noreferrer'>Clickjacking</a>.</p><p>Você pode encontrar mais detalhes no <a href='https://docs.joomla.org/Special:MyLanguage/J4.x:Http_Header_Management' target='_blank' rel='noopener noreferrer'>HTTP Header Management Tutorial no Joomla! Documentação.</a></p>"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_TITLE="Cabeçalhos de segurança HTTP"
PLG_SYSTEM_HTTPHEADERS_REFERRERPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy' target='_blank' rel='noopener noreferrer'>Referrer-Policy</a>"
PLG_SYSTEM_HTTPHEADERS_XFRAMEOPTIONS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options' target='_blank' rel='noopener noreferrer'>X-Frame-Options</a>"
PLG_SYSTEM_HTTPHEADERS_XML_DESCRIPTION="Este plugin ajuda a configurar os HTTP Security Headers."
