COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Bem-vindo ao Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Atualizações do Núcleo</h2><div class=\"col-12 mb-3\"><h3>Melhorias na Edição de Conteúdo</h3><ul><li><strong>Integrações com o Gerenciador de Mídia / Leia Mais</strong>: Adicionar imagens e mídias ficou mais fácil com o seletor atualizado que agora abre o Gerenciador de Mídia do Joomla, e o novo botão Leia Mais oferece uma forma mais rápida de inserir quebras de artigo.</li><li><strong>Classes separadas para imagem e figura</strong>: As imagens de introdução e de texto completo dos artigos agora possuem campos de classe CSS independentes para a imagem e para o elemento figure que a envolve.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Menus de subnível\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Template do Site (Cassiopeia)</h3><ul><li><strong>Menus suspensos multinível</strong>: Os menus do Cassiopeia agora suportam mais de um subnível em layouts suspensos e recolhíveis.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Módulos &amp; Configuração do Site</h3><ul class=\"mb-3\"><li><strong>Alternadores de links do mod_login</strong>: Novas opções permitem que os administradores ocultem os links “Esqueceu sua senha?” e “Esqueceu seu nome de usuário?” sem necessidade de override de template. O padrão é Exibir, sem impacto em sites existentes.</li><li><strong>Sinalizador de segurança para atualizações de extensões</strong>: Os desenvolvedores podem sinalizar um lançamento como atualização de segurança (gravidade de Nenhuma a Crítica); as atualizações sinalizadas são destacadas em Sistema -&gt; Atualizar -&gt; Extensões e no ícone rápido do painel.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Etiquetas de segurança nas extensões\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="O que há de novo no Joomla 6.2!"
